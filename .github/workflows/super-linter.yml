name: Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read
  packages: read
  statuses: write

jobs:
  super-linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # super-linter diffs against this to lint only changed files
          # (VALIDATE_ALL_CODEBASE: false below) — needs real history, not
          # the default shallow single-commit checkout.
          fetch-depth: 0

      - name: Super-linter
        uses: super-linter/super-linter@v7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: master
          # Only lint files touched by this push/PR, not the whole existing
          # codebase — this repo has no lint history yet, so a full-codebase
          # run on day one would fail on everything at once rather than
          # gating new changes. Flip to true later for a one-off baseline
          # sweep once existing issues are cleaned up.
          VALIDATE_ALL_CODEBASE: false

          # super-linter rejects mixing true/false VALIDATE_* flags in one
          # run ("Behavior not supported, please either only include or
          # exclude linters, but not both" — hit live on the first run of
          # this workflow). So this list is opt-IN only: anything not named
          # here (notably PYTHON_PYLINT — the most opinionated of the Python
          # linters, and this codebase's style hasn't been tuned against it)
          # is implicitly off, not explicitly disabled.
          VALIDATE_PYTHON_BLACK: true
          VALIDATE_PYTHON_ISORT: true
          VALIDATE_PYTHON_FLAKE8: true
          VALIDATE_PYTHON_MYPY: true

          VALIDATE_YAML: true
          VALIDATE_MARKDOWN: true
          VALIDATE_JSON: true

          # Local run artifacts and reverse-engineering tooling output —
          # never lint-worthy source (data/ is committed scraped data,
          # auth/ and .tools/ hold captured-credential/APK tooling).
          FILTER_REGEX_EXCLUDE: (^|/)(data|auth|\.tools)/.*
